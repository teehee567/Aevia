[workspace]
resolver = "3"
exclude = ["firmware/src/device/hal"]
members = [
    "app/rust",
    # Exact glob prevents Cargo treating nested HAL as an explicit member.
    "firmwar[e]",
    "traj",
]

[profile.dev.package.firmware]
opt-level = "s"

[profile.release.package.firmware]
codegen-units = 1
debug = 2
opt-level = "s"
