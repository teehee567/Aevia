[package]
name = "aevia-firmware"
version = "0.1.0"
edition = "2024"
default-run = "aevia-firmware"

publish = false
autobins = false

[features]
default = ["device"]
device = []

[[bin]]
name = "aevia-firmware"
path = "src/main.rs"
required-features = ["device"]
test = false
bench = false

[dependencies]
heapless = "0.9.1"

[dev-dependencies]
embassy-futures = "0.1"

[target.'cfg(target_arch = "riscv32")'.dependencies]
static_cell = "2.1.1"
embassy-executor = "0.10.0"
embassy-futures = "0.1"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false }
embedded-io-async = "0.7.0"
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "160b10794227eb84805b8676fe188c1110801e9d", features = ["esp32s31", "panic-handler", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "160b10794227eb84805b8676fe188c1110801e9d", features = ["esp32s31"] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "160b10794227eb84805b8676fe188c1110801e9d", features = ["esp32s31", "unstable"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "160b10794227eb84805b8676fe188c1110801e9d", features = ["esp32s31"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "160b10794227eb84805b8676fe188c1110801e9d", features = ["embassy", "esp32s31"] }
