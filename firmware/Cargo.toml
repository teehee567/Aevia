[package]
edition      = "2024"
name         = "firmware"
version      = "0.1.0"

[[bin]]
name = "firmware"
path = "src/bin/main.rs"
test = false
bench = false

[dependencies]
aevia-device-hal = { path = "src/device/hal", features = ["esp32s31"] }
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"], default-features = false }
sha2 = { version = "0.10.9", default-features = false }
cobs = { version = "0.3", default-features = false }
aevia-trajectory = { path = "../traj", features = ["development"] }
libm = "0.2.16"
embassy-sync = "0.8.0"

[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
# Local platform support supplies capture/PMA/cache and bounded display I/O.
esp32s31 = "0.3.0"
esp-hal = { version = "~1.2.2", features = ["esp32s31", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp32s31",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s31",] }

embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-time = "0.5.1"
embedded-io-async = "0.7.0"
embedded-graphics = "0.8"
embassy-usb = { version = "0.6.0", default-features = false }
esp-alloc = { version = "0.11.0", features = ["esp32s31"] }
esp-storage = { version = "0.10.0", features = ["esp32s31"] }
static_cell = "2.1.1"
