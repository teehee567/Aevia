[package]
name = "aevia-device-hal"
version = "0.1.0"
edition = "2024"
description = "Portable, datasheet-backed HAL components for Aevia hardware"
publish = false

# Isolated intentionally: integration into the firmware is a separate change.
[workspace]

[lib]
path = "mod.rs"

[features]
default = []
esp32s31 = ["dep:esp-hal", "dep:esp-storage", "dep:nb"]

[dependencies]
embedded-hal = "1.0.0"
embedded-io = "0.7.1"
embedded-storage = "0.3.2"
libm = "0.2.16"

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s31", "unstable"], optional = true }
esp-storage = { version = "0.10.0", features = ["esp32s31", "embedded-storage"], optional = true }
nb = { version = "1.1.0", optional = true }
